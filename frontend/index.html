<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./app-icon-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nigrani AI — AI-Powered Public Project Intelligence</title>

    <!-- Instant Anti-Flash Theme Initializer -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('nigrani-theme');
          var isDark = false;
          if (saved === 'dark') {
            isDark = true;
          } else if (saved === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CSS CDN with Enterprise AI Theme Extension -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              navy: {
                950: '#070b14', // Canvas background dark
                900: '#0b1222', // Primary dark card surface
                850: '#0f172a', // Card surface
                800: '#142038', // Elevated surface
                750: '#1a2846', // Hover surface
                700: '#23365d', // Active surface
                600: '#324b7e', // Border strong
              },
              brand: {
                blue: '#0284c7',
                cyan: '#06b6d4',
                green: '#10b981',
              },
              gov: {
                50: '#f0f5fa',
                100: '#dbe7f3',
                600: '#1b4d89',
                700: '#153b6b',
                800: '#102d52',
                900: '#0b1f38',
              },
              risk: {
                low: '#10b981',
                medium: '#f59e0b',
                high: '#f97316',
                critical: '#ef4444',
              }
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      code, pre {
        font-family: 'JetBrains Mono', monospace;
      }
      /* Theme-aware smooth scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 9999px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #1e293b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #334155;
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-[#070b14] text-slate-900 dark:text-slate-100 antialiased min-h-screen transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
