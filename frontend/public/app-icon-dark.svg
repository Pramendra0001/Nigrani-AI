<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128" fill="none">
  <defs>
    <!-- Primary Flow Gradient: Deep Blue -> Electric Cyan -> Vibrant Green -->
    <linearGradient id="n-flow-grad" x1="14" y1="84" x2="82" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="25%" stop-color="#2563EB" />
      <stop offset="65%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Front Diagonal Ribbon Gradient -->
    <linearGradient id="n-front-ribbon" x1="32" y1="18" x2="82" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Back Left Leg Gradient -->
    <linearGradient id="n-back-leg" x1="14" y1="84" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Observation / Intelligence Node Gradient -->
    <linearGradient id="n-dot-grad" x1="66" y1="12" x2="86" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="60%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Top Highlight Shimmer -->
    <linearGradient id="n-top-shimmer" x1="28" y1="14" x2="56" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Drop Filter -->
    <filter id="n-node-glow" x="62" y="8" width="28" height="28" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0B1220" />

  <!-- Layer 1: Left Vertical Stem & Inner Sweep -->
  <path
    d="M 17 81 C 17 84 21 86 25 86 C 29 86 33 84 33 81 L 33 38 C 33 30 38 24 45 22 C 37 20 28 24 22 32 C 18 38 17 48 17 58 Z"
    fill="url(#n-back-leg)"
  />

  <!-- Layer 2: Main Arch & Descending Diagonal Ribbon -->
  <path
    d="M 17 58 C 17 38 28 17 46 15 C 57 14 67 19 72 28 C 74 32 72 38 67 46 L 47 77 C 44 82 39 85 33 85 L 25 85 C 21 85 17 83 17 81 Z"
    fill="url(#n-flow-grad)"
  />

  <!-- Layer 3: Foreground Front Diagonal Leg -->
  <path
    d="M 44 16 C 53 14 64 18 70 28 C 73 33 71 39 66 47 L 46 78 C 43 83 37 86 31 86 L 25 86 C 22 86 20 85 19 83 C 25 83 33 79 38 71 L 58 41 C 61 36 62 31 59 27 C 55 21 47 18 38 20 C 40 18 42 17 44 16 Z"
    fill="url(#n-front-ribbon)"
    opacity="0.95"
  />

  <!-- Layer 4: Right Downward Leg Terminal Foot -->
  <path
    d="M 58 41 L 76 72 C 79 77 78 83 74 85 C 70 86 65 85 62 80 L 45 52 Z"
    fill="url(#n-front-ribbon)"
  />

  <!-- Layer 5: Top Curve Highlight -->
  <path
    d="M 28 26 C 33 19 41 15 50 16 C 59 17 66 22 69 29 C 64 22 55 18 46 19 C 38 20 32 23 28 26 Z"
    fill="url(#n-top-shimmer)"
  />

  <!-- Layer 6: Observation & Intelligence Dot -->
  <circle
    cx="76"
    cy="22"
    r="9.5"
    fill="url(#n-dot-grad)"
    filter="url(#n-node-glow)"
  />
</svg>