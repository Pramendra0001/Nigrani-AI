services:
  - type: web
    name: nigrani-ai-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://pramendra0001.github.io
